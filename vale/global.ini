MinAlertLevel = suggestion

Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[formats]
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = Vale, Google, proselint, Readability, ai-tells
Vale.Spelling = NO
Google.Spelling = NO
Google.DateFormat = NO
Google.AMPM = NO
Google.Anthropomorphism = NO
Google.EmDash = NO
Google.Quotes = NO
Google.Colons = NO
Google.Semicolons = NO
Google.We = NO
ai-tells.ColonUsage = NO

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits
