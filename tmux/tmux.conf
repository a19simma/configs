# bind C-l send-keys 'C-l'

bind-key C-o rotate-window

# ---------------------------------------------------------------------------
# sesh — session picker over tmux sessions, sesh.toml configs and zoxide dirs.
# t is the picker, same letter as the prefix. next-window keeps prefix+space;
# s is split-window, L clear-history, a last-pane, so o is what was left for
# the last-session toggle.
# ---------------------------------------------------------------------------
# -t lists live tmux sessions only. Bare `sesh picker` also unions sesh.toml
# configs and zoxide, and zoxide is every directory ever cd'd into, so the list
# fills with dirs that have no session behind them.
#
# display-popup -E is what gives the TUI a real TTY. The picker connects on
# its own.
#
# Wrapped in sh because default-shell below is nushell, and display-popup runs
# its command string through default-shell. Anything relying on POSIX syntax
# breaks there silently: the popup just closes.
bind-key -N "session picker (sesh)" t \
  display-popup -E -w 80% -h 70% "sh -c 'sesh picker -t --icons --preview'"

# sesh needs this off so closing a session does not detach the client. It also
# breaks native prefix+L, which is why `sesh last` exists.
set -g detach-on-destroy off
bind-key -N "last session (via sesh)" o run-shell "sesh last"

bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80

bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key T previous-window

bind-key [ copy-mode

bind-key ] paste-buffer

run-shell 'tmux setenv -g TMUX_VERSION "$(tmux -V | cut -c 6-)"'

# Setup 'v' to begin selection as in Vim
# Update default binding of `Enter` to also use copy-pipe
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind -T copy-mode-vi Enter

# Clipboard tool differs per platform: pbcopy on macOS, wl-copy on Wayland.
# tmux also emits OSC 52 to the outer terminal (set-clipboard defaults to
# "external"), but the explicit pipe is what makes this work over SSH-less
# local panes without relying on terminal support.
if-shell 'command -v pbcopy' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
}

set-window-option -g display-panes-time 1500

# Kanagawa Theme - Status Bar
set-option -g status-interval 5  # Reduced from 1 to 5 for better performance
set-option -g status-position top

# Colors (Kanagawa theme)
# Background: #1f1f28 (sumiInk1)
# Foreground: #dcd7ba (fujiWhite)
# Selection: #2d4f67 (waveBlue2)
# Accent: #7e9cd8 (crystalBlue)
# Active: #98bb6c (springGreen)

# Status bar styling
set-option -g status-style bg="#1f1f28",fg="#dcd7ba"
set-option -g status-left-length 40
set-option -g status-right-length 80

# Left side: session name
set-option -g status-left "#[bg=#7e9cd8,fg=#1f1f28,bold] #S #[bg=#1f1f28,fg=#7e9cd8]"

# Right side: date and time
set-option -g status-right "#[fg=#7e9cd8]#[bg=#7e9cd8,fg=#1f1f28] %Y-%m-%d %H:%M "

# Window tabs styling
set-window-option -g window-status-style bg="#1f1f28",fg="#727169"
set-window-option -g window-status-format " #I:#W "

# Active window tab
set-window-option -g window-status-current-style bg="#2d4f67",fg="#dcd7ba",bold
set-window-option -g window-status-current-format " #I:#W "

# Window activity styling
set-window-option -g window-status-activity-style bg="#c34043",fg="#dcd7ba"
set-window-option -g window-status-bell-style bg="#e6c384",fg="#1f1f28"

# Pane borders
set-option -g pane-active-border-style fg="#7e9cd8",bold
set-option -g pane-border-lines double

# Command line/message styling
set-option -g message-style bg="#2d4f67",fg="#dcd7ba"
set-option -g message-command-style bg="#2d4f67",fg="#dcd7ba"

# Copy mode styling
set-window-option -g mode-style bg="#2d4f67",fg="#dcd7ba"

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Use nushell as the default shell
if-shell '[ -x "$HOME/.local/share/mise/shims/nu" ]' 'run-shell "tmux set-option -g default-shell $HOME/.local/share/mise/shims/nu"'
set-option -g default-command "nu -l"

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Mouse. The hand-rolled WheelUpPane/WheelDownPane bindings that used to live
# here were the tmux 2.1 workaround; tmux ships that exact binding as a root
# default now, and its version also guards on pane_in_mode and mouse_any_flag:
#
#   bind -T root WheelUpPane if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -e }
#
# So `mouse on` alone is strictly better. alternate_on is what forwards the
# wheel to full-screen apps (nvim, less, lazygit) instead of entering copy mode.
set -g mouse on

# Wheel in copy mode moves prompt-to-prompt instead of 5 lines at a time, so
# scrolling lands on command boundaries rather than drifting into older output.
# previous-prompt puts the prompt line at the top of the view, i.e. "show this
# command from its start".
#
# tmux has no way to hard-stop a scroll at the previous prompt (no option, no
# format variable for prompt marks); jumping is the closest thing that exists.
#
# Requires the shell to emit OSC 133 (\033]133;A\033\\) or these are no-ops:
# see shell_integration.osc133 in nushell/config.nu. -o jumps to the start of
# command *output* instead of the prompt, bound below on { and }.
bind-key -T copy-mode-vi WheelUpPane   send-keys -X previous-prompt
bind-key -T copy-mode-vi WheelDownPane send-keys -X next-prompt
bind-key -T copy-mode-vi '[' send-keys -X previous-prompt
bind-key -T copy-mode-vi ']' send-keys -X next-prompt
bind-key -T copy-mode-vi '{' send-keys -X previous-prompt -o
bind-key -T copy-mode-vi '}' send-keys -X next-prompt -o

# Disable assume-paste-time, so that iTerm2's "Send Hex Codes" feature works
# with tmux 2.1. This is backwards-compatible with earlier versions of tmux,
# AFAICT.
set-option -g assume-paste-time 0
