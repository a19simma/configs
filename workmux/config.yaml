# workmux global config. Stowed to ~/.config/workmux/config.yaml.
#
# Most sandbox keys are GLOBAL-ONLY: workmux ignores them in a project
# .workmux.yaml and prints a warning. That is deliberate, a repo must not be
# able to weaken its own sandbox. So they live here, not per project.

# One tmux session per worktree, not one window. sesh then enumerates worktrees
# natively (prefix+t, ^t filters to tmux sessions), so no second picker.
mode: session

# Keep worktrees out of ~/repos. The default is a sibling '<project>__worktrees'
# dir, which sesh's `~/repos/*` wildcard would scan, listing every worktree
# twice: once as a directory, once as a live session.
worktree_dir: ~/.workmux/{project}
worktree_naming: basename

# Named agent profile, used by the `<agent>` placeholder below.
#
# `type` declares the agent kind explicitly instead of letting workmux sniff the
# executable name. Under the container sandbox the pane command is
# `workmux sandbox run ...`, which matches nothing, so sniffing yields no kind.
#
# `args` exists because --tools is CLI-only, with no settings.json equivalent.
# The interactive alias in nushell/config.nu:87 carries the same list, but it is
# a nushell alias and workmux launches the agent through the container's dash,
# so the alias never fires and the agent would otherwise get every tool. Keep
# the two lists in sync; drift means the sandbox quietly has tools the host
# session does not.
#
# --dangerously-skip-permissions is deliberately absent: the sandbox gets
# permissions.defaultMode: bypassPermissions from its settings.json instead.
agent: cc-sandbox

agents:
  cc-sandbox:
    type: claude
    command: claude
    args:
      - --tools
      - Bash,Read,Edit,Write,Agent,Skill,ToolSearch,ListAgents,NotebookEdit,WebFetch,WebSearch

# Same four windows sesh/sesh.toml:16 gives a plain repo session, so a worktree
# and a repo read identically. The commands differ though: sesh runs them under
# nushell via tmux's default-command, workmux runs the agent one through the
# container's dash, where the nushell claude alias never fires. That is why the
# agent args live in the `agents:` block above.
windows:
  # Sandboxed. `<agent>` expands to the configured agent command.
  - name: agent
    panes:
      - command: <agent>
        focus: true
  # Second agent, in the same container as the first rather than a sandbox of
  # its own, so both see one worktree and one /cache.
  #
  # `<agent>` is not usable here: it only expands for the pane workmux itself
  # sandboxes, which is the `agent` window above. Going through `shell -e`
  # means the tool list is written out by hand, so this is now the third copy
  # after nushell/config.nu:87 and the `agents:` block above. All three have to
  # move together.
  #
  # wm-user because a bare exec lands as root; see the box window below.
  #
  # Via wm-sandbox-shell.sh, not `workmux sandbox shell -e` directly: workmux
  # starts every window at once, and `shell -e` fails if the agent window has
  # not created the container yet. Losing that race drops the pane to a host
  # shell that looks nearly identical, so it goes unnoticed. The wrapper polls
  # for wm-<worktree>-* first. Absolute path because tmux runs pane commands
  # through nushell and the wrapper is POSIX.
  #
  # Both agents run with HOME=/tmp and so share one /tmp/.claude.json. Last
  # writer wins on anything claude persists there, sessions and history
  # included. They also share WM_RPC_TOKEN, and workmux keys agent status per
  # worktree, so the dashboard and sidebar are expected to show a single status
  # for the pair, whichever hook fired last. Unverified which of the two it
  # reports; treat the status of a two-agent worktree as unreliable.
  - name: agent2
    panes:
      - command: >-
          /Users/simon/repos/configs/scripts/wm-sandbox-shell.sh wm-user claude --tools
          Bash,Read,Edit,Write,Agent,Skill,ToolSearch,ListAgents,NotebookEdit,WebFetch,WebSearch
  # Host windows. sandbox.target below is 'agent', so of the windows above only
  # `agent` is containerised by workmux itself; `agent2` gets into the same
  # container by exec'ing into it. nvim and lazygit run as the host user
  # against the worktree.
  - name: edit
    panes:
      - command: nvim
  - name: git
    panes:
      - command: lazygit
  # Dev servers bind host ports directly, so localhost in the browser just
  # works, no container port publishing involved.
  - name: run
  # Interactive shell inside the same container as the agent window. -e execs
  # into the running container instead of starting a second one, so it shares
  # the agent's mounts, network rules and /cache.
  #
  # No wm-user in the command: sandbox-env.nu demotes nu itself, so the wrapper
  # would be redundant here. Any non-nu command given to `shell -e` still needs
  # it spelled out, as agent2 above does.
  #
  # wm-sandbox-shell.sh for the startup race, same as agent2.
  - name: box
    panes:
      - command: /Users/simon/repos/configs/scripts/wm-sandbox-shell.sh nu

sandbox:
  enabled: true
  backend: container
  # Default. Only the agent pane is sandboxed; the edit, git and run windows
  # stay on the host. Accepted trade: agent-written code can run as the host user when the
  # run window builds or tests the worktree.
  target: agent

  image: workmux-sandbox-mise

  # Empty on purpose. Any proxied command can execute code from project files,
  # e.g. an agent writes a justfile then runs `just`. Proxied commands run on
  # the host with network access.
  host_commands: []

  # Keep the sandbox off the real ~/.claude, which is otherwise mounted
  # read-write and would let a sandboxed agent rewrite host settings, MCP
  # servers and hooks.
  agent_config_dir: ~/.config/workmux/agents/{agent}

  # Warm cache shared by every container sandbox. The containers are
  # ephemeral, so without this each new worktree pays a fresh download or
  # source build for anything its mise.toml pins that the image does not
  # already carry.
  #
  # Writable and shared by all sandboxes, which is the point and also the
  # caveat: it is one mutable directory every sandboxed agent can write to, so
  # it is a channel between them and the one place where sandbox isolation is
  # deliberately not per-worktree. Tool binaries only; nothing secret belongs
  # here.
  #
  # Linux artifacts only. Never point this at the host's ~/.local/share/mise:
  # that tree is aarch64-apple-darwin, and mise would report those tools as
  # installed while every exec died with `Exec format error`.
  extra_mounts:
    - host_path: ~/.workmux/cache
      guest_path: /cache
      writable: true

    # nushell config for `workmux sandbox shell -e -- nu`, read-only so it
    # cannot become a second write channel between sandboxes the way /cache is.
    #
    # Its own directory, not ~/.config/nushell: the host config sources mise.nu,
    # ~/.zoxide.nu, starship and atuin unconditionally and branches to
    # env-macos.nu, none of which exist in the image. network-init.sh copies
    # these two into /tmp/.config/nushell as env.nu and config.nu, so plain `nu`
    # picks them up with no flags.
    - host_path: ~/repos/configs/workmux-sandbox/nushell
      guest_path: /opt/nushell
      writable: false

    # Personal skills. agent_config_dir keeps the sandbox off ~/.claude, which
    # also cost it every skill in ~/.claude/skills, so /grill-me and friends
    # were missing inside the container.
    #
    # Nested under the agent_config_dir mount at /tmp/.claude; the runtime
    # orders bind mounts by path depth, so the deeper one wins. It shadows
    # /tmp/.claude/skills/synced, i.e. the account-managed docx/pdf/pptx/xlsx
    # and skill-creator skills are not visible in the sandbox. Trade accepted:
    # the personal set is what actually gets invoked here.
    #
    # Read-only on purpose. Skills are instructions the agent executes, so a
    # writable mount would let a sandboxed agent rewrite what every later
    # sandbox runs, and these files are shared with the host agent.
    - host_path: ~/.claude/skills
      guest_path: /tmp/.claude/skills
      writable: false

    # Subagent definitions, same reasoning as skills above: agent_config_dir
    # cut the sandbox off from ~/.claude, so researcher, runner, test, review*
    # and architect were undefined inside the container. Nothing is shadowed
    # here, /tmp/.claude/agents did not exist at all.
    #
    # Read-only for the same reason: an agent definition is a prompt the model
    # executes, and these files are shared with the host agent.
    - host_path: ~/.claude/agents
      guest_path: /tmp/.claude/agents
      writable: false

  container:
    runtime: docker
    # Nested dockerd without SYS_ADMIN. workmux rejects cap_add ALL/SYS_ADMIN
    # unconditionally for the docker and podman runtimes since v0.1.241, so the
    # documented DinD recipe no longer works. sysbox-runc needs no caps at all:
    # it gives the container's root a private user namespace plus virtualized
    # /proc and /sys, which is enough for both iptables and an inner dockerd.
    #
    # Requires sysbox-ce in the colima VM, registered as a runtime in
    # ~/.config/colima/default/colima.yaml. Without it, every sandbox dies at
    # exec with `unknown or invalid runtime name`.
    oci_runtime: sysbox-runc
    # Shadowed by a read-only /dev/null bind mount. Worktree-relative only;
    # absolute paths and '..' are rejected, directories cannot be masked.
    # Not a seal: .git/objects is mounted read-write, so anything ever
    # committed is still reachable via `git cat-file`. Rotate, do not mask.
    excluded_files:
      - .env
      - .env.local
      - .env.production

  network:
    # Default is `allow`, i.e. unrestricted. Opt in to deny.
    # Enforced by in-container iptables plus a host CONNECT proxy, so ignoring
    # proxy env vars does not bypass it. HTTPS/443 only; git+ssh is blocked, use
    # HTTPS remotes. Blocked connections REJECT rather than hang, so failures
    # surface immediately instead of timing out.
    policy: deny
    allowed_domains:
      # agent
      # Reconciled against Anthropic's published list:
      # https://code.claude.com/docs/en/network-config#network-access-requirements
      # Cross-checked against the host strings in the claude v2.1.245 binary.
      # Anything not in both was dropped: statsig.anthropic.com is not a real
      # host (feature flags ride api.anthropic.com), console.anthropic.com is
      # superseded by platform.claude.com, and www.claude.ai appears in no CLI
      # URL.
      #
      # When something in a sandbox cannot reach the network, read
      # ~/.local/state/workmux/workmux.log. The proxy logs every decision as
      # `WARN rejected: domain not in allowlist hostname="..."`, which names the
      # host outright and beats guessing. Restart the sandbox after editing this
      # list: a running container keeps the rules it booted with.

      # API traffic, plus the WebFetch domain safety check, feature flags and
      # telemetry.
      - api.anthropic.com
      # OAuth. Load-bearing and the one that was missing: authorize, token
      # exchange at /v1/oauth/token, refresh and revocation all live here, for
      # both claude.ai and Console accounts. Without it login dies on
      # `OAuth error: proxy refused the connection`.
      - platform.claude.com
      # claude.ai account auth, and /oauth/claude-code-client-metadata.
      - claude.ai
      # Sign-in page the browser opens, and pre-approved WebFetch doc lookups
      # made from the CLI.
      - claude.com
      # Self-updater and update version checks. Login does not need it; without
      # it in-sandbox `claude update` fails.
      - downloads.claude.ai
      # claude.ai MCP connectors, which are on by default. Set
      # ENABLE_CLAUDEAI_MCP_SERVERS=false to drop this instead.
      - mcp-proxy.anthropic.com
      # Docs lookups by the claude-code-guide agent.
      - code.claude.com
      # git over https
      - github.com
      - codeload.github.com
      - objects.githubusercontent.com
      - raw.githubusercontent.com
      # package registries
      - registry.npmjs.org
      # Playwright browser binaries. `npm i -D @playwright/test` needs neither
      # of these (1.63.0 ships no install/postinstall script, so the npm step
      # only touches registry.npmjs.org); `npx playwright install` needs them.
      #
      # Both hosts on purpose. playwright-core's PLAYWRIGHT_CDN_MIRRORS holds
      # three entries and browserFetcher retries 5 times, cycling through the
      # list: attempt 1 is cdn.playwright.dev and attempt 2 is the prss.microsoft
      # ESRP CDN. Allowing only the first works until the CDN hiccups, at which
      # point the retry that exists to save you is the one that gets refused.
      #
      # Chromium is included: 1.63.0 re-hosts the Chrome-for-Testing builds on
      # cdn.playwright.dev rather than storage.googleapis.com, so there is no
      # Google host to allow.
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - crates.io
      - static.crates.io
      - index.crates.io
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      # rustup's dist server, for a toolchain a project pins but the image does
      # not bake. Without it `mise install` reports
      # `error sending request: tunnel error: unsuccessful`.
      - static.rust-lang.org
      # mise resolves every `github:` tool through the releases API, so runtime
      # installs of those need this. Read-only and unauthenticated in here: no
      # token is passed into the sandbox, which also means the 60 req/hour
      # anonymous limit applies.
      - api.github.com
      # Where the API then redirects the actual asset bytes. GitHub moved
      # release downloads off objects.githubusercontent.com onto this host, so
      # api.github.com alone resolves the version and then dies on the
      # download. The most-rejected host in the proxy log after telemetry: 22
      # refusals, the last at 2026-09-16T08:30Z.
      - release-assets.githubusercontent.com
      # Docker Hub, for the nested dockerd (sandbox.container.oci_runtime is
      # sysbox-runc). registry-1.docker.io is the only one proven necessary so
      # far: `docker pull postgres:18` died on its first /v2/ probe with
      # `Forbidden` and the proxy logged
      # `rejected: domain not in allowlist hostname="registry-1.docker.io"`.
      # auth.docker.io and production.cloudfront.docker.com are proven too: the
      # pull walks registry -> auth token -> blobs, and each host only surfaced
      # once the one before it was allowed. cloudfront, not cloudflare; it is
      # AWS CloudFront and the wrong spelling fails as
      # `error pulling image configuration: download failed after attempts=6`.
      # index.docker.io is unproven, kept because older clients resolve through
      # it.
      - registry-1.docker.io
      - auth.docker.io
      - production.cloudfront.docker.com
      - index.docker.io
      # Google's registry, for `FROM gcr.io/distroless/...` base images. The
      # nested dockerd logged
      # `Error getting v2 registry: Get "https://gcr.io/v2/": Forbidden` and the
      # e2e API image build died there. gcr.io answers the manifest and then
      # redirects layer blobs to storage.googleapis.com, so the second host is
      # needed too or the pull fails after the manifest resolves.
      - gcr.io
      - storage.googleapis.com

      # mise's own version registry. It falls back to the GitHub API when this
      # is refused, so blocking it only costs a `(transient)` warning and a
      # slower resolve, but there is no reason to pay that.
      - mise-versions.jdx.dev
      # mise's site and download host, used by the install script and by
      # `mise self-update`. Rejected 4 times on 2026-09-15.
      - mise.jdx.dev
nerdfont: true
