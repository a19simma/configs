      #   Sigstore error: TUF error: GET
      #   https://tuf-repo-cdn.sigstore.dev/16.root.json failed
      #
      # Allowing it strengthens the sandbox rather than loosening it. Blocked,
      # the signature check fails closed by accident, and the only way to get
      # the tool installed is to turn verification off. Allowed, the check runs.
