      # Docker Hub, for the nested dockerd (sandbox.container.oci_runtime is
      # sysbox-runc). registry-1.docker.io is the only one proven necessary so
      # far: `docker pull postgres:18` died on its first /v2/ probe with
      # `Forbidden` and the proxy logged
      # `rejected: domain not in allowlist hostname="registry-1.docker.io"`.
      # auth.docker.io and production.cloudfront.docker.com are proven too: the
      # pull walks registry -> auth token -> blobs, and each host only surfaced
      # once the one before it was allowed. cloudfront, not cloudflare; it is
      # AWS CloudFront and the wrong spelling fails as
      # `error pulling image configuration: download failed after attempts=6`.
      # index.docker.io is unproven, kept because older clients resolve through
      # it.
      - registry-1.docker.io
      - auth.docker.io
      - production.cloudfront.docker.com
      - index.docker.io
      # Google's registry, for `FROM gcr.io/distroless/...` base images. The
      # nested dockerd logged
      # `Error getting v2 registry: Get "https://gcr.io/v2/": Forbidden` and the
      # e2e API image build died there. gcr.io answers the manifest and then
      # redirects layer blobs to storage.googleapis.com, so the second host is
      # needed too or the pull fails after the manifest resolves.
      - gcr.io
      - storage.googleapis.com
      # GitHub's container registry, for images a chart or compose file pulls
      # from ghcr.io. Same manifest-then-blob split as gcr.io above: ghcr.io
      # serves the manifest and redirects layer bytes to
      # pkg-containers.githubusercontent.com, so allowing only the first
      # resolves the tag and then dies on the download.
      - ghcr.io
      - pkg-containers.githubusercontent.com

      # Helm chart repos for the paas platform bootstrap. `helm repo add` and
      # `fetch-charts` hit these directly; without them the chart pull fails
      # before any image is ever requested.
      #
      # argoproj.github.io and charts.loft.sh are GitHub Pages / vendor CDNs
      # that serve index.yaml plus the .tgz from the same host, so one entry
      # each is enough. Unlike the registries above there is no second blob
      # host to chase.
      #
      # Rook/Ceph is not here: its chart is pulled from a different host than
      # the three below. Add it when a rejection actually shows up rather than
      # guessing the name now.
      - helm.cilium.io
      - argoproj.github.io
      - charts.loft.sh

      # kubectl and helm vendor download hosts. Both are also pinned in
      # workmux-sandbox/mise.sandbox.toml, which is the faster path and needs
      # no network at all. These stay allowed so a project's own mise.toml or
      # an install script works unchanged instead of depending on the image
      # having baked the right version. Rejected 13 and 5 times respectively
      # by a paas worktree on 2026-09-29.
      - dl.k8s.io
      - get.helm.sh

      # Microsoft's container registry, for `FROM mcr.microsoft.com/...` base
      # images in the nested dockerd. mcr.microsoft.com answers the manifest and
      # redirects layer blobs to a regional host, westeurope.data.mcr.microsoft.com
      # from here, rejected 14 times on 2026-10-07. The wildcard covers every
      # region; it skips the base host, so both entries are needed.
      - mcr.microsoft.com
      - "*.data.mcr.microsoft.com"

      # Red Hat's Quay registry, for keycloak's `FROM quay.io/keycloak/keycloak`
      # in the nested dockerd. The pull died on `Forbidden (403)` and the proxy
      # logged `rejected: domain not in allowlist hostname="quay.io"` 5 times on
      # 2026-10-07. quay.io answers the token and manifest, then redirects every
      # blob to cdn01.quay.io. Red Hat lists cdn and cdn01 through cdn06 and
      # allows the wildcard in their place; it skips the base host, so both
      # entries are needed.
      - quay.io
      - "*.quay.io"

      # shadcn-svelte's component registry. `npx shadcn-svelte@latest add <x>`
      # fetches the component JSON from https://shadcn-svelte.com/registry/...
      # and dies without it. Rejected 4 times on 2026-09-18 between 17:54 and
      # 17:57. registry.npmjs.org above covers fetching the CLI itself.
      - shadcn-svelte.com

      # The Buf Schema Registry. `buf generate`, `buf dep update` and any
      # buf.lock referencing a BSR module resolve over https://buf.build, so
      # without it the generate step fails offline and the .proto build stops.
      # Rejected 3 times on 2026-09-24 between 21:00 and 21:01. The buf CLI
      # itself arrives via mise/GitHub releases, already covered above.
      #
      # Remote plugins may need a further host; add it when a rejection for one
      # actually shows up in the log rather than guessing at it now.
      - buf.build

      # Sigstore's TUF root, fetched by mise before it verifies a GitHub
      # artifact attestation. mise checks attestations by default on the aqua
